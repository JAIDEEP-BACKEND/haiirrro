<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded hexagon / shield -->
  <rect width="90" height="90" rx="22" x="5" y="5" fill="#0f172a" stroke="url(#grad)" stroke-width="2" />
  <!-- Futuristic 'H' logo -->
  <path d="M 28 26 L 38 26 L 38 45 L 62 45 L 62 26 L 72 26 L 72 74 L 62 74 L 62 55 L 38 55 L 38 74 L 28 74 Z" 
        fill="url(#grad)" filter="url(#glow)" />
  <!-- Decorative tech accents -->
  <circle cx="50" cy="50" r="3" fill="#00f2fe" />
  <circle cx="28" cy="26" r="2.5" fill="#4facfe" />
  <circle cx="72" cy="74" r="2.5" fill="#7928ca" />
</svg>
