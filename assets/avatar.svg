<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="ringLight" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="200" cy="200" r="185" fill="url(#bgGrad)" stroke="url(#cyberNeon)" stroke-width="3" />
  <circle cx="200" cy="200" r="170" fill="url(#ringLight)" />

  <!-- Orbiting Circuit Rings -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="12 8" opacity="0.4" />
  <circle cx="200" cy="200" r="160" fill="none" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="24 16 8 16" opacity="0.5" />

  <!-- Circuit nodes -->
  <circle cx="70" cy="150" r="4" fill="#00f2fe" filter="url(#neonBlur)" />
  <line x1="70" y1="150" x2="110" y2="150" stroke="#00f2fe" stroke-width="1.5" opacity="0.5" />
  <circle cx="330" cy="240" r="4" fill="#9333ea" filter="url(#neonBlur)" />
  <line x1="330" y1="240" x2="290" y2="240" stroke="#9333ea" stroke-width="1.5" opacity="0.5" />
  <circle cx="280" cy="90" r="3.5" fill="#38bdf8" filter="url(#neonBlur)" />

  <!-- Avatar Base Silhouette -->
  <!-- Shoulders / Jacket -->
  <path d="M 100 350 C 100 275, 140 250, 200 250 C 260 250, 300 275, 300 350 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <!-- Jacket Collar / Cyber Lapels -->
  <path d="M 155 258 L 200 315 L 245 258" fill="none" stroke="url(#cyberNeon)" stroke-width="3" filter="url(#neonBlur)" />
  <path d="M 175 320 L 200 350 L 225 320" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7" />

  <!-- Neck -->
  <rect x="178" y="210" width="44" height="48" rx="8" fill="#e2e8f0" opacity="0.85" />

  <!-- Head / Face -->
  <ellipse cx="200" cy="180" rx="55" ry="65" fill="#cbd5e1" />

  <!-- Cyber Visor / Glasses -->
  <path d="M 150 162 C 150 152, 250 152, 250 162 L 244 186 C 220 196, 180 196, 156 186 Z" fill="#090d16" stroke="url(#cyberNeon)" stroke-width="2.5" />
  <!-- Visor Neon Glow Bar -->
  <path d="M 156 168 Q 200 174 244 168" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round" filter="url(#neonBlur)" />
  <path d="M 165 177 Q 200 182 235 177" stroke="#9333ea" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Stylish Modern Hair -->
  <path d="M 142 165 C 135 125, 160 95, 200 95 C 245 95, 265 120, 260 165 C 250 135, 235 120, 200 120 C 165 120, 150 135, 142 165 Z" fill="#0f172a" />
  <path d="M 170 98 Q 210 90 238 108" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <path d="M 190 106 Q 225 104 248 122" stroke="#9333ea" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Floating Hologram Elements -->
  <!-- Code brackets -->
  <text x="75" y="115" font-family="monospace" font-size="22" font-weight="bold" fill="#00f2fe" opacity="0.75" filter="url(#neonBlur)">&lt; / &gt;</text>
  <!-- AI / Neural spark -->
  <text x="300" y="125" font-family="monospace" font-size="20" font-weight="bold" fill="#a855f7" opacity="0.85" filter="url(#neonBlur)">{AI}</text>
  <!-- Floating dot grid -->
  <circle cx="105" cy="220" r="2.5" fill="#38bdf8" opacity="0.5" />
  <circle cx="115" cy="220" r="2.5" fill="#38bdf8" opacity="0.3" />
  <circle cx="105" cy="230" r="2.5" fill="#38bdf8" opacity="0.3" />
  <circle cx="115" cy="230" r="2.5" fill="#38bdf8" opacity="0.1" />

  <circle cx="285" cy="210" r="2.5" fill="#a855f7" opacity="0.5" />
  <circle cx="295" cy="210" r="2.5" fill="#a855f7" opacity="0.3" />
  <circle cx="285" cy="220" r="2.5" fill="#a855f7" opacity="0.3" />
</svg>
